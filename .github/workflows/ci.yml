name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.28'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked coverage run -m pytest -q -rs
      - run: uv run --locked coverage report
      - name: Build distributions and exercise installed wheel
        run: |
          uv build
          uv venv build/wheel-env
          uv pip install --python build/wheel-env/bin/python dist/*.whl
          build/wheel-env/bin/noscheme parse examples/stm32h523/stm32h523.nosch --output build/wheel-smoke.json
          build/wheel-env/bin/noscheme compile --project examples/blink

  kicad-libraries:
    name: KiCad 10 library integration
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.28'
          python-version: '3.12'
          enable-cache: true
      - name: Install KiCad library data
        run: |
          sudo add-apt-repository --yes --no-update ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y kicad-symbols kicad-footprints kicad-demos
          for package in kicad-symbols kicad-footprints kicad-demos; do
            version=$(dpkg-query -W -f='${Version}' "$package")
            echo "$package $version"
            case "${version#*:}" in
              10.0.*) ;;
              *) echo "Expected KiCad 10.0 package: $package" >&2; exit 1 ;;
            esac
          done
          test -f /usr/share/kicad/symbols/Device.kicad_sym
          test -d /usr/share/kicad/footprints
          test -f /usr/share/kicad/demos/ecc83/ecc83-pp.kicad_pcb
      - run: uv sync --locked
      - run: uv run --locked pytest -q -rs

  native-parser:
    name: Native C++ (${{ matrix.compiler }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.28'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ clang meson ninja-build cmake default-jre-headless libssl-dev
      - run: python3 -m tools.native_dependencies --fetch
      - name: Build native compiler core
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          if [ "$CXX" = clang++ ]; then
            meson setup build/native --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false
          else
            meson setup build/native --buildtype=release
          fi
          meson compile -C build/native -j 4
      - run: meson test -C build/native --print-errorlogs
