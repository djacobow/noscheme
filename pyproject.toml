[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noscheme"
version = "0.1.0"
description = "A declarative PCB design language"
requires-python = ">=3.11"
dependencies = [
    "lark==1.3.1",
    "pygls==2.1.1",
    "sexpdata==1.0.2",
]

[project.scripts]
noscheme = "noscheme.cli:main"
noscheme-lsp = "noscheme.lsp:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.14",
    "sexpdata==1.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noscheme = ["*.lark"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "tools/experiments/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
